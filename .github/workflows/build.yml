name: Pake Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build App with Pake
        run: pake https://room.lfn.moe --name UniSound

      # 核心修复：把 Pake 生成的 exe/msi 复制到当前工作目录，方便统一收集
      - name: Copy build artifacts to workspace
        run: |
          $npmPath = npm config get prefix
          Write-Host "Searching in $npmPath"
          Get-ChildItem -Path "$npmPath" -Recurse -Include *.exe, *.msi | Copy-Item -Destination "." -Force
          Get-ChildItem -Recurse
        shell: pwsh

      # 上传所有生成的安装包和 exe
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-packages
          path: |
            *.exe
            *.msi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.exe
            *.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
